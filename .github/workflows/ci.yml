name: Test bindings

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew :android:lintRelease :android:publishReleasePublicationToStagingRepository :android:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: boko-android
          path: build/maven/

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked -m python/Cargo.toml -o dist
          rust-toolchain: 1.91.0
          maturin-version: 1.9.6
          manylinux: auto
      - uses: PyO3/maturin-action@v1
        if: runner.os == 'Linux'
        with:
          command: sdist
          args: -m python/Cargo.toml -o dist
          rust-toolchain: 1.91.0
          maturin-version: 1.9.6
      - name: Install and test wheel
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m unittest discover -s tests -p test_python.py -v
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: boko-python-${{ matrix.os }}
          path: dist/*