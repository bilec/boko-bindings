name: Test bindings

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :android:lintRelease :android:publishReleasePublicationToMavenLocal :android:assembleDebugAndroidTest
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        run: ./gradlew :android:publishReleasePublicationToSonatypeRepository closeAndReleaseSonatypeStagingRepository

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked -m python/Cargo.toml -o dist
          rust-toolchain: 1.91.0
          maturin-version: 1.9.6
          manylinux: auto
      - uses: PyO3/maturin-action@v1
        if: runner.os == 'Linux'
        with:
          command: sdist
          args: -m python/Cargo.toml -o dist
          rust-toolchain: 1.91.0
          maturin-version: 1.9.6
      - name: Install and test wheel
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m unittest discover -s tests -p test_python.py -v
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: boko-python-${{ matrix.os }}
          path: dist/*

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: python
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: boko-python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
