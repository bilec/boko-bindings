[workspace]
members = ["native", "android/jni", "python"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-only"

[workspace.dependencies]
boko = { version = "=0.5.0", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true